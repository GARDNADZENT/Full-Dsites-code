name: deriv-egress-probe

# Diagnostic, not product code. Answers one question:
#   can any host outside Supabase Edge reach Deriv's WebSocket API?
# app_register is WebSocket-only, so if WS is reachable the manual DevHub step
# can be automated. Issues are disabled on this repo, so results are posted as a
# commit comment, which the API serves without credentials. Delete this
# workflow once the question is settled.

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'scripts/deriv-egress-probe.mjs'
      - 'scripts/deriv-egress-handshake.mjs'
      - 'scripts/deriv-egress-sweep.mjs'
      - 'scripts/deriv-new-api-probe.mjs'
      - '.github/workflows/deriv-egress-probe.yml'
  workflow_dispatch:

permissions:
  # contents:write is required to create a commit comment.
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Built-in WebSocket against every Deriv host
        run: node scripts/deriv-egress-probe.mjs | tee probe.txt

      - name: Plain HTTPS status sweep across Deriv hosts
        run: node scripts/deriv-egress-sweep.mjs | tee -a probe.txt

      - name: HTTPS status for the WebSocket endpoint
        # No header-control retry: the 520 is an origin-side failure at
        # Cloudflare, so browser-like headers cannot change it. The script
        # degrades gracefully when the optional ws package is absent.
        run: node scripts/deriv-egress-handshake.mjs | tee -a probe.txt

      - name: Locate the applications API on the new platform
        # app_register is legacy-WS-only and needs the admin scope the current
        # token page does not offer. The new platform has application_read and a
        # reachable HTTPS base, so look for the endpoint instead of assuming.
        run: node scripts/deriv-new-api-probe.mjs | tee -a probe.txt

      - name: DNS and raw TCP context
        if: always()
        run: |
          {
            echo ""
            echo "### DNS + raw TCP"
            for h in ws.derivws.com ws.binaryws.com frontend.deriv.com api.derivws.com; do
              echo "=== $h ==="
              getent hosts "$h" || echo "no A record"
              timeout 8 bash -c "cat < /dev/null > /dev/tcp/$h/443" && echo "tcp443 open" || echo "tcp443 failed"
            done
            echo ""
            echo "### Derived WSS host used by the trading UI"
            echo 'https://derivws.com/app_id/1089/l/EN' >/dev/null
          } | tee -a probe.txt

      - name: Publish result as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const body = [
              "<!-- deriv-egress-probe -->",
              "**Deriv WebSocket egress probe** (run " + process.env.GITHUB_RUN_ID + ")",
              "",
              "```",
              fs.readFileSync("probe.txt", "utf8"),
              "```",
            ].join("\n");
            fs.writeFileSync("comment.json", JSON.stringify({ body }));
          '
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            --input comment.json --jq '.html_url'
